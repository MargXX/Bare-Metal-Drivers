name: CI
on: push
jobs:
  build:
    name: RP2040 Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
      - name: Clone Pico SDK
        run: git clone --depth 1 --branch 2.3.0 https://github.com/raspberrypi/pico-sdk.git
      - name: Set PICO_SDK_PATH
        run: echo "PICO_SDK_PATH=${{ github.workspace }}/pico-sdk" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build
  test:
    name: Host Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B tests/build
      - name: Build
        run: cmake --build tests/build
      - name: Run Tests
        run: ctest --test-dir tests/build --output-on-failure
