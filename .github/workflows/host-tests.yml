name: Host Unit Tests
on: push
jobs:
  test:
    name: Host Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B tests/build
      - name: Build
        run: cmake --build tests/build
      - name: Run Tests
        run: ctest --test-dir tests/build --output-on-failure
